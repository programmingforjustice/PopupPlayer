plugins {
    id 'com.android.application'
	id 'kotlin-android'
    id 'com.google.devtools.ksp' version "2.0.21-1.0.28"
}

android {
    compileSdk 35
	  namespace "nl.blauw.pipplayer"
		
    defaultConfig {
        applicationId "nl.blauw.pipplayer"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    
    signingConfigs {
        release {
            // 키스토어 정보 설정
            storeFile file("./release-key.jks") // 키스토어 파일 경로
            storePassword "1q2w3e4r" // 키스토어 비밀번호
            keyAlias "my-release-key" // 키 별칭
            keyPassword "1q2w3e4r" // 키 비밀번호
        }
    }
    
    // flavor 구분용 dimension
    flavorDimensions "mode"

    productFlavors {
        dev {
            dimension "mode"
            applicationId "nl.blauw.pipplayer.dev"
            versionNameSuffix "-dev"
        }

        prod {
            dimension "mode"
            applicationId "nl.blauw.pipplayer"
        }
    }

    buildTypes {
        release {
            // 릴리즈 빌드 설정
            signingConfig signingConfigs.release
            minifyEnabled false // ProGuard 활성화
            shrinkResources false // 리소스 축소
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 디버그 빌드 설정 (서명하지 않음)
            //signingConfig signingConfigs.debug
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
  	buildFeatures {
  	    buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer:2.18.0'
    implementation 'org.jellyfin.exoplayer:exoplayer-ffmpeg-extension:2.18.1+2'
	//implementation 'androidx.appcompat:appcompat:1.7.0-alpha01'
    implementation 'com.google.android.material:material:1.9.0'
    //implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha05'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.20'
	  implementation 'androidx.databinding:viewbinding:8.2.0'
	  implementation 'androidx.recyclerview:recyclerview:1.3.2'
	  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
      implementation 'androidx.core:core-ktx:1.9.0'
      implementation 'com.github.zjupure:webpdecoder:2.4.4.16.0'
      implementation 'com.github.bumptech.glide:glide:4.14.0'

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"     // coroutines Flow 지원
    ksp "androidx.room:room-compiler:2.6.1"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

      //annotationProcessor 'com.github.bumptech.glide:compiler:4.14.0'

        //implementation 'com.google.android.material:material:1.12.0'
        //implementation 'androidx.recyclerview:recyclerview:1.3.2'
        //implementation 'com.github.bumptech.glide:glide:4.16.0'   // 썸네일 로딩
        //implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'  // lifecycleScope
}

