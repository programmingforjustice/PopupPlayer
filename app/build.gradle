plugins {
    id 'com.android.application'
	id 'kotlin-android'
}

android {
    compileSdk 33
	  namespace "nl.blauw.pipplayer"
		
    defaultConfig {
        applicationId "nl.blauw.pipplayer"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    
    signingConfigs {
        release {
            // 키스토어 정보 설정
            storeFile file("./release-key.jks") // 키스토어 파일 경로
            storePassword "1q2w3e4r" // 키스토어 비밀번호
            keyAlias "my-release-key" // 키 별칭
            keyPassword "1q2w3e4r" // 키 비밀번호
        }
    }

    buildTypes {
        release {
            // 릴리즈 빌드 설정
            signingConfig signingConfigs.release
            minifyEnabled false // ProGuard 활성화
            shrinkResources false // 리소스 축소
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 디버그 빌드 설정 (서명하지 않음)
            signingConfig signingConfigs.debug
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
  	buildFeatures {
  	    buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer:2.18.0'
    implementation 'org.jellyfin.exoplayer:exoplayer-ffmpeg-extension:2.18.1+2'
	implementation 'androidx.appcompat:appcompat:1.7.0-alpha01'
    implementation 'com.google.android.material:material:1.9.0'
    //implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha05'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.20'
	  implementation 'androidx.databinding:viewbinding:8.2.0'
	  //implementation 'androidx.recyclerview:recyclerview:1.3.2'
	  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
      implementation 'androidx.core:core-ktx:1.9.0'
}
