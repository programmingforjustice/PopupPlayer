plugins {
    id 'com.android.application'
	  id 'kotlin-android'
}

android {
    compileSdk 33
	  namespace "nl.blauw.pipplayer"
		
    defaultConfig {
        applicationId "nl.blauw.pipplayer"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
  	buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer:2.18.0'
    implementation 'com.google.android.exoplayer:extension-ffmpeg:2.18.1+2'
	  implementation 'androidx.appcompat:appcompat:1.7.0-alpha01'
    implementation 'com.google.android.material:material:1.8.0-rc01'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha05'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
	  implementation 'androidx.databinding:viewbinding:8.1.0-alpha02'
	  implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
